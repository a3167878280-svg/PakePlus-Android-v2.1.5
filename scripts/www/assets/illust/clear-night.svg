<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2340"/>
      <stop offset="0.62" stop-color="#1b3a63"/>
      <stop offset="1" stop-color="#10263f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4b55" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#153a45" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <!-- moon -->
  <path d="M920 85c-52 10-90 58-90 114 0 65 53 118 118 118 30 0 58-12 79-30-14 52-63 90-121 90-72 0-130-58-130-130 0-78 66-140 144-162z" fill="#d7e3ff" opacity="0.92"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="110" cy="90" r="2"/>
    <circle cx="180" cy="60" r="1.6"/>
    <circle cx="260" cy="120" r="1.8"/>
    <circle cx="340" cy="80" r="2"/>
    <circle cx="420" cy="140" r="1.6"/>
    <circle cx="520" cy="70" r="1.6"/>
    <circle cx="610" cy="110" r="2"/>
    <circle cx="720" cy="60" r="1.6"/>
    <circle cx="860" cy="110" r="1.6"/>
    <circle cx="980" cy="70" r="1.8"/>
    <circle cx="1040" cy="130" r="1.6"/>
    <circle cx="250" cy="190" r="1.6"/>
    <circle cx="610" cy="180" r="1.6"/>
  </g>

  <!-- distant hills -->
  <path d="M0 280 C160 235 260 275 390 255 C520 230 610 215 720 255 C860 310 980 230 1200 275 L1200 350 L0 350 Z" fill="#1b2f4a" opacity="0.7"/>

  <rect x="0" y="470" width="1200" height="230" fill="url(#water)"/>

  <!-- bridge -->
  <g opacity="0.75" filter="url(#soft)">
    <path d="M0 460 C120 430 200 430 340 460" fill="none" stroke="#0a0a0a" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 468 C115 510 190 510 265 468" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- houses -->
  <g filter="url(#soft)" opacity="0.85">
    <path d="M650 410 L650 315 L740 315 L740 410 Z" fill="#f7f5ef"/>
    <path d="M640 322 L695 285 L750 322" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M785 420 L785 330 L900 330 L900 420 Z" fill="#f7f5ef"/>
    <path d="M775 338 L840 295 L910 338" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- warm window lights -->
  <g opacity="0.5" filter="url(#soft)">
    <rect x="675" y="360" width="26" height="26" rx="4" fill="#ffd45a"/>
    <rect x="710" y="360" width="26" height="26" rx="4" fill="#ffd45a" opacity="0.75"/>
    <rect x="805" y="375" width="26" height="26" rx="4" fill="#ffd45a"/>
    <rect x="840" y="375" width="26" height="26" rx="4" fill="#ffd45a" opacity="0.75"/>
  </g>

  <!-- reflections -->
  <g opacity="0.14" fill="none" stroke="#d7e3ff" stroke-width="6" stroke-linecap="round">
    <path d="M820 560c60 20 120 20 180 0"/>
  </g>

  <!-- moonlight ripple -->
  <g opacity="0.10" fill="none" stroke="#d7e3ff" stroke-width="8" stroke-linecap="round">
    <path d="M780 600c80 28 160 28 240 0"/>
  </g>
</svg>
