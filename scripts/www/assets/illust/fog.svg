<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0ee"/>
      <stop offset="0.62" stop-color="#f6f7f5"/>
      <stop offset="1" stop-color="#e7e9e6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d7d5" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#b6c9c7" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <path d="M0 290 C180 250 280 300 420 280 C560 260 660 240 760 280 C900 340 1010 260 1200 300 L1200 360 L0 360 Z" fill="#ddd7cd" opacity="0.35"/>

  <rect x="0" y="470" width="1200" height="230" fill="url(#water)"/>

  <!-- faint boat silhouette -->
  <g opacity="0.12" filter="url(#soft)">
    <path d="M470 575 C510 560 550 560 595 575 C565 592 505 592 470 575 Z" fill="#2a2a2a"/>
    <path d="M530 545 V575" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- softened distant trees -->
  <g opacity="0.12" filter="url(#soft)" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round">
    <path d="M120 430 V390"/>
    <path d="M140 430 V400"/>
    <path d="M100 430 V405"/>
    <path d="M1040 430 V395"/>
    <path d="M1060 430 V405"/>
  </g>

  <g opacity="0.85" filter="url(#soft)">
    <path d="M650 410 L650 315 L740 315 L740 410 Z" fill="#f7f5ef"/>
    <path d="M640 322 L695 285 L750 322" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M785 420 L785 330 L900 330 L900 420 Z" fill="#f7f5ef"/>
    <path d="M775 338 L840 295 L910 338" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- fog layers -->
  <g opacity="0.55" fill="#ffffff" filter="url(#soft)">
    <path d="M0 390 C180 360 320 420 520 390 C720 360 900 420 1200 390 L1200 460 L0 460 Z"/>
    <path d="M0 430 C160 410 330 460 540 430 C750 400 930 470 1200 430 L1200 510 L0 510 Z"/>
    <path d="M0 480 C200 460 380 520 600 480 C820 440 980 540 1200 490 L1200 600 L0 600 Z"/>
  </g>
</svg>
