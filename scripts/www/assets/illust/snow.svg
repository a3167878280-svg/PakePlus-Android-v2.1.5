<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="0.62" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e7eef6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe1ea" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b8ccd7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <!-- pale clouds -->
  <g filter="url(#soft)" opacity="0.75" fill="#ffffff">
    <path d="M160 140c0-34 28-62 62-62 26 0 49 16 57 40 5-2 10-3 16-3 30 0 55 25 55 55 0 31-25 56-55 56H199c-19 0-35-16-35-35 0-3 0-6 1-9-1 0-1 0-1-1z"/>
    <path d="M540 120c0-40 33-73 73-73 31 0 58 20 69 49 6-2 13-3 20-3 36 0 66 30 66 66 0 36-30 66-66 66H580c-23 0-40-17-40-40 0-4 1-8 2-12-1 0-1 0-2-1z"/>
  </g>

  <!-- distant hills -->
  <path d="M0 280 C160 230 260 270 390 250 C520 225 610 210 720 250 C860 305 980 225 1200 270 L1200 340 L0 340 Z" fill="#d9d6ce" opacity="0.45"/>

  <!-- river -->
  <rect x="0" y="470" width="1200" height="230" fill="url(#water)"/>

  <!-- bridge -->
  <g opacity="0.9" filter="url(#soft)">
    <path d="M0 460 C120 430 200 430 340 460" fill="none" stroke="#2a2a2a" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 468 C115 510 190 510 265 468" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- houses -->
  <g filter="url(#soft)" opacity="0.92">
    <path d="M650 410 L650 315 L740 315 L740 410 Z" fill="#ffffff"/>
    <path d="M640 322 L695 285 L750 322" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M785 420 L785 330 L900 330 L900 420 Z" fill="#ffffff"/>
    <path d="M775 338 L840 295 L910 338" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- snow caps on roofs -->
  <g opacity="0.45" filter="url(#soft)" fill="#ffffff">
    <path d="M648 320 L695 290 L742 320 Q695 308 648 320 Z"/>
    <path d="M783 336 L840 300 L897 336 Q840 324 783 336 Z"/>
  </g>

  <!-- bare winter tree -->
  <g opacity="0.55" filter="url(#soft)" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round">
    <path d="M420 470 C420 430 418 380 430 340" fill="none"/>
    <path d="M428 380 C410 365 395 345 385 325" fill="none" stroke-width="6"/>
    <path d="M432 378 C450 360 462 342 472 320" fill="none" stroke-width="6"/>
    <path d="M420 420 C405 408 392 392 382 372" fill="none" stroke-width="6" opacity="0.85"/>
  </g>

  <!-- snow blanket on bank -->
  <path d="M0 430 C180 420 260 450 390 440 C550 428 650 410 820 438 C980 465 1080 430 1200 440 L1200 510 L0 510 Z" fill="#ffffff" opacity="0.28"/>

  <!-- falling snow (soft dots) -->
  <g opacity="0.85" fill="#ffffff">
    <circle cx="120" cy="230" r="3"/>
    <circle cx="200" cy="260" r="2"/>
    <circle cx="290" cy="215" r="3"/>
    <circle cx="380" cy="255" r="2"/>
    <circle cx="470" cy="220" r="3"/>
    <circle cx="560" cy="250" r="2"/>
    <circle cx="650" cy="225" r="3"/>
    <circle cx="740" cy="260" r="2"/>
    <circle cx="830" cy="220" r="3"/>
    <circle cx="920" cy="255" r="2"/>
    <circle cx="1010" cy="220" r="3"/>
    <circle cx="1090" cy="255" r="2"/>
    <circle cx="150" cy="190" r="2"/>
    <circle cx="520" cy="210" r="2"/>
    <circle cx="690" cy="190" r="2"/>
    <circle cx="980" cy="210" r="2"/>
  </g>

  <!-- subtle snow sparkle on water -->
  <g opacity="0.12" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M700 600c45 16 90 16 135 0"/>
  </g>
</svg>
