<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4da"/>
      <stop offset="0.62" stop-color="#fff8ea"/>
      <stop offset="1" stop-color="#f4eadc"/>
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="18%" r="45%">
      <stop offset="0" stop-color="#fff7c7"/>
      <stop offset="0.45" stop-color="#ffd45a"/>
      <stop offset="1" stop-color="#ffb400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6df" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#b6d2c9" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>
  <rect width="1200" height="700" fill="url(#sun)" opacity="0.95"/>

  <!-- distant warm hills -->
  <path d="M0 260 C160 210 260 250 390 230 C520 205 610 190 720 230 C860 285 980 205 1200 250 L1200 320 L0 320 Z" fill="#e7d0a9" opacity="0.55"/>
  <path d="M0 290 C180 250 280 300 420 280 C560 260 660 240 760 280 C900 340 1010 260 1200 300 L1200 350 L0 350 Z" fill="#ddc199" opacity="0.45"/>

  <!-- river -->
  <rect x="0" y="470" width="1200" height="230" fill="url(#water)"/>

  <!-- bridge -->
  <g opacity="0.9" filter="url(#soft)">
    <path d="M0 460 C120 430 200 430 340 460" fill="none" stroke="#2a2a2a" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 468 C115 510 190 510 265 468" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- bank -->
  <path d="M0 430 C180 420 260 450 390 440 C550 428 650 410 820 438 C980 465 1080 430 1200 440 L1200 510 L0 510 Z" fill="#cdb47d" opacity="0.3"/>

  <!-- trees -->
  <g filter="url(#soft)">
    <path d="M285 420 C270 360 280 320 320 290 C350 266 380 270 400 292 C425 320 428 355 415 392 C402 430 365 450 330 448 C310 446 295 436 285 420 Z" fill="#a6c36f" opacity="0.85"/>
    <path d="M326 455 C330 420 338 365 330 315" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- houses -->
  <g filter="url(#soft)" opacity="0.92">
    <path d="M650 410 L650 315 L740 315 L740 410 Z" fill="#fbfaf4"/>
    <path d="M640 322 L695 285 L750 322" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M785 420 L785 330 L900 330 L900 420 Z" fill="#fbfaf4"/>
    <path d="M775 338 L840 295 L910 338" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M910 420 L910 350 L1020 350 L1020 420 Z" fill="#fbfaf4"/>
    <path d="M900 360 L965 320 L1030 360" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- house details (windows/doors) -->
  <g opacity="0.55" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round" filter="url(#soft)">
    <path d="M690 410 V365"/>
    <path d="M700 380 H720"/>
    <path d="M820 420 V385"/>
    <path d="M830 395 H855"/>
    <path d="M955 420 V385"/>
    <path d="M965 395 H990"/>
  </g>

  <!-- small boat on river -->
  <g opacity="0.75" filter="url(#soft)">
    <path d="M520 560 C555 545 595 545 635 560 C610 580 545 580 520 560 Z" fill="#2a2a2a" opacity="0.22"/>
    <path d="M560 525 L560 560" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round" opacity="0.28"/>
    <path d="M560 528 C585 538 600 552 610 565" fill="none" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
  </g>

  <!-- birds -->
  <g opacity="0.35" fill="none" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round">
    <path d="M260 170 q18 -14 36 0"/>
    <path d="M300 170 q18 -14 36 0"/>
    <path d="M880 210 q18 -14 36 0"/>
    <path d="M920 210 q18 -14 36 0"/>
  </g>

  <!-- gentle sparkles -->
  <g opacity="0.18" fill="#ffffff">
    <circle cx="220" cy="160" r="3"/>
    <circle cx="520" cy="190" r="2"/>
    <circle cx="940" cy="210" r="3"/>
    <circle cx="1020" cy="140" r="2"/>
  </g>
</svg>
