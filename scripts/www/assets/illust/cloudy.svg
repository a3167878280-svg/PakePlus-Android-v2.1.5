<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2efe8"/>
      <stop offset="0.62" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#efe7dd"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0d8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b8c9c1" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <!-- distant hills -->
  <path d="M0 260 C160 210 260 250 390 230 C520 205 610 190 720 230 C860 285 980 205 1200 250 L1200 320 L0 320 Z" fill="#e3d7c4" opacity="0.65"/>
  <path d="M0 290 C180 250 280 300 420 280 C560 260 660 240 760 280 C900 340 1010 260 1200 300 L1200 350 L0 350 Z" fill="#d8cfbf" opacity="0.55"/>

  <!-- clouds -->
  <g filter="url(#soft)" opacity="0.78" fill="#ffffff">
    <path d="M120 120c0-30 24-54 54-54 23 0 43 14 51 35 5-1 10-2 15-2 26 0 47 21 47 47 0 26-21 47-47 47H150c-17 0-30-13-30-30 0-3 0-6 1-9-1 0-1 0-1-1z"/>
    <path d="M470 100c0-38 31-69 69-69 29 0 54 18 63 45 6-2 12-3 19-3 34 0 61 27 61 61 0 34-27 61-61 61H509c-21 0-39-17-39-39 0-3 0-6 1-9-1 0-1 0-1-1z"/>
    <path d="M840 120c0-34 28-62 62-62 26 0 49 16 57 40 5-2 10-3 16-3 30 0 55 25 55 55 0 31-25 56-55 56H879c-19 0-35-16-35-35 0-3 0-6 1-9-1 0-1 0-1-1z"/>
  </g>

  <!-- extra thin cloud wash -->
  <g opacity="0.28" filter="url(#soft)" fill="#ffffff">
    <path d="M0 170 C180 120 320 200 520 160 C720 120 900 210 1200 160 L1200 220 L0 220 Z"/>
  </g>

  <!-- river -->
  <rect x="0" y="470" width="1200" height="230" fill="url(#water)"/>

  <!-- bridge -->
  <g opacity="0.9" filter="url(#soft)">
    <path d="M0 460 C120 430 200 430 340 460" fill="none" stroke="#2a2a2a" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 468 C115 510 190 510 265 468" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- trees and bank -->
  <path d="M0 430 C180 420 260 450 390 440 C550 428 650 410 820 438 C980 465 1080 430 1200 440 L1200 510 L0 510 Z" fill="#c9b991" opacity="0.35"/>

  <!-- main tree -->
  <g filter="url(#soft)">
    <path d="M285 420 C270 360 280 320 320 290 C350 266 380 270 400 292 C425 320 428 355 415 392 C402 430 365 450 330 448 C310 446 295 436 285 420 Z" fill="#a8b56b" opacity="0.85"/>
    <path d="M326 455 C330 420 338 365 330 315" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M328 352 C312 340 302 325 292 310" fill="none" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M334 350 C352 338 365 324 377 306" fill="none" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- houses (ink style) -->
  <g filter="url(#soft)" opacity="0.92">
    <path d="M650 410 L650 315 L740 315 L740 410 Z" fill="#f7f5ef"/>
    <path d="M640 322 L695 285 L750 322" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M785 420 L785 330 L900 330 L900 420 Z" fill="#f7f5ef"/>
    <path d="M775 338 L840 295 L910 338" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M910 420 L910 350 L1020 350 L1020 420 Z" fill="#f7f5ef"/>
    <path d="M900 360 L965 320 L1030 360" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M700 410 L700 360" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
    <path d="M830 420 L830 372" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- house details (windows/lantern) -->
  <g opacity="0.5" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round" filter="url(#soft)">
    <path d="M690 410 V365"/>
    <path d="M700 382 H720"/>
    <path d="M820 420 V385"/>
    <path d="M830 396 H855"/>
  </g>
  <g opacity="0.22" filter="url(#soft)">
    <circle cx="760" cy="360" r="10" fill="#ffd45a"/>
  </g>

  <!-- reeds on river bank -->
  <g opacity="0.35" stroke="#2a2a2a" stroke-width="5" stroke-linecap="round">
    <path d="M1040 480 v40"/>
    <path d="M1060 485 v38"/>
    <path d="M1080 478 v42"/>
    <path d="M1040 500 q18 -10 36 0" fill="none"/>
  </g>

  <!-- birds -->
  <g opacity="0.25" fill="none" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round">
    <path d="M220 190 q18 -14 36 0"/>
    <path d="M260 190 q18 -14 36 0"/>
    <path d="M920 200 q18 -14 36 0"/>
    <path d="M960 200 q18 -14 36 0"/>
  </g>

  <!-- water reflections -->
  <g opacity="0.18">
    <path d="M620 520 C700 540 780 540 860 520" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 560 C340 580 430 580 520 560" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
