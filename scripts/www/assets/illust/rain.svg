<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ddd9"/>
      <stop offset="0.62" stop-color="#e8ebe7"/>
      <stop offset="1" stop-color="#d8dfdb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd1cf" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a6bdbb" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <!-- heavy clouds -->
  <g filter="url(#soft)" opacity="0.92" fill="#ffffff">
    <path d="M120 150c0-36 30-66 66-66 28 0 52 18 61 43 6-2 12-3 19-3 32 0 58 26 58 58 0 32-26 58-58 58H126c-20 0-36-16-36-36 0-4 1-8 2-12-1 0-1 0-2-1z"/>
    <path d="M430 135c0-44 36-80 80-80 34 0 63 22 75 52 7-2 14-3 22-3 39 0 71 32 71 71 0 40-32 72-71 72H475c-25 0-45-20-45-45 0-3 0-6 1-9-1 0-1-1-1-1z"/>
    <path d="M820 150c0-38 31-69 69-69 30 0 55 19 65 46 6-2 12-3 19-3 34 0 62 28 62 62 0 34-28 62-62 62H859c-22 0-39-17-39-39 0-4 1-8 2-12-1 0-1 0-2-1z"/>
  </g>

  <!-- distant hills -->
  <path d="M0 280 C160 230 260 270 390 250 C520 225 610 210 720 250 C860 305 980 225 1200 270 L1200 340 L0 340 Z" fill="#d7cbb5" opacity="0.5"/>

  <!-- river -->
  <rect x="0" y="470" width="1200" height="230" fill="url(#water)"/>

  <!-- bridge and houses -->
  <g opacity="0.9" filter="url(#soft)">
    <path d="M0 460 C120 430 200 430 340 460" fill="none" stroke="#2a2a2a" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 468 C115 510 190 510 265 468" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- umbrella figure on bridge -->
  <g opacity="0.55" filter="url(#soft)" stroke="#2a2a2a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 438 Q215 410 245 438" fill="none" stroke-width="10"/>
    <path d="M215 420 V468" fill="none" stroke-width="8"/>
    <path d="M215 468 Q208 478 205 486" fill="none" stroke-width="7"/>
    <path d="M210 468 Q198 482 192 496" fill="none" stroke-width="7" opacity="0.75"/>
  </g>

  <g filter="url(#soft)" opacity="0.92">
    <path d="M650 410 L650 315 L740 315 L740 410 Z" fill="#f7f5ef"/>
    <path d="M640 322 L695 285 L750 322" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M785 420 L785 330 L900 330 L900 420 Z" fill="#f7f5ef"/>
    <path d="M775 338 L840 295 L910 338" fill="none" stroke="#2a2a2a" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- rain strokes (watercolor lines) -->
  <g opacity="0.28" stroke="#2f6f86" stroke-width="3" stroke-linecap="round">
    <path d="M120 250 l-20 40"/>
    <path d="M190 235 l-22 44"/>
    <path d="M260 255 l-20 40"/>
    <path d="M360 240 l-22 44"/>
    <path d="M470 255 l-20 40"/>
    <path d="M560 240 l-22 44"/>
    <path d="M660 255 l-20 40"/>
    <path d="M760 240 l-22 44"/>
    <path d="M860 255 l-20 40"/>
    <path d="M960 240 l-22 44"/>
    <path d="M1060 255 l-20 40"/>
    <path d="M140 300 l-20 40"/>
    <path d="M240 315 l-22 44"/>
    <path d="M520 300 l-20 40"/>
    <path d="M820 315 l-22 44"/>
    <path d="M980 300 l-20 40"/>
  </g>

  <!-- puddle ripples -->
  <g opacity="0.12" fill="none" stroke="#2f6f86" stroke-width="6" stroke-linecap="round">
    <path d="M420 585c35 15 70 15 105 0"/>
    <path d="M720 615c40 16 80 16 120 0"/>
    <path d="M250 610c30 12 60 12 90 0"/>
  </g>
</svg>
